# Render blueprint for the platform MCP server. In Render: New → Blueprint → this repo.
# Set DATABASE_URL (Neon, with sslmode=require) and MCP_BEARER_TOKEN in the dashboard.
services:
  - type: web
    name: level-studio-platform
    runtime: node
    rootDir: platform/mcp
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: GAMES_BASE_URL
        sync: false
