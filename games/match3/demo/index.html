<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gem Garden</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#a2d9b4,#438b76 48%,#174c52 100%);color:#fffdf2;font:16px Georgia,serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,550px);background:#fcf1d6;color:#315c4b;border:5px solid #f5d58f;border-radius:30px;padding:24px;box-shadow:0 24px 70px #163d3aa6}.top{display:flex;justify-content:space-between;align-items:start;gap:12px}.eyebrow{font:700 12px system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#6a9875}h1{font-size:34px;margin:4px 0;color:#315c4b}.stats{display:flex;gap:10px}.stat{background:#e6f1d7;padding:9px 13px;border-radius:14px;text-align:center;min-width:78px}.stat b{display:block;font:700 20px system-ui,sans-serif}.stat small{color:#61846c}.goal{margin:16px 0 12px;color:#466b56}.bar{height:10px;background:#dce8ce;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f25f55,#f6a941);width:0;transition:width .2s}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:10px;background:#d2e7c3;border:3px solid #b5d4a9;border-radius:20px;touch-action:manipulation}.gem{aspect-ratio:1;border:0;border-radius:12px;background:#eff4de;box-shadow:inset 0 2px 4px #fff,0 3px 3px #53784d38;cursor:pointer;display:grid;place-items:center;padding:2px;transition:transform .13s,outline .13s}.gem svg{width:92%;height:92%;filter:drop-shadow(0 2px 1px #48603a44);pointer-events:none}.gem:hover{transform:scale(1.09) rotate(-3deg)}.gem.sel{outline:3px solid #f18b39;transform:scale(1.1) rotate(4deg);z-index:1}.gem.hint{animation:hint-pulse 1.1s ease-in-out 2;z-index:2}@keyframes hint-pulse{50%{transform:scale(1.16);box-shadow:0 0 0 5px #ffe59c,0 0 20px #ffac45}}.gem.success{animation:fruit-pop 1.25s cubic-bezier(.2,.8,.3,1.2);z-index:2}@keyframes fruit-pop{0%{transform:scale(.82) rotate(-8deg)}38%{transform:scale(1.28) rotate(8deg);box-shadow:0 0 0 7px #ffe59c,0 0 24px #ffac45}68%{transform:scale(.94) rotate(-3deg)}100%{transform:scale(1) rotate(0);box-shadow:inset 0 2px 4px #fff,0 3px 3px #53784d38}}.msg{height:26px;margin:10px 2px;color:#557963;font:15px system-ui,sans-serif}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.actions button{border:0;border-radius:14px;padding:11px 16px;background:#e7794f;color:white;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #bc563d}.actions .secondary{background:#6e9c68;box-shadow:0 3px 0 #4c794c}.actions span{font:13px system-ui,sans-serif;color:#66836c}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-width:480px){body{padding:12px}.card{padding:16px;border-radius:22px}.board{gap:4px;padding:7px}.gem{border-radius:8px}.stat{min-width:64px;padding:8px}}
</style><style>.gem.void{visibility:hidden;pointer-events:none;background:transparent;box-shadow:none}.gem.obstacle{position:relative}.sealmark{position:absolute;width:43%;height:43%;right:-2%;top:-2%;border-radius:5px;background:#b8793d;border:1px solid #fff0bb;box-shadow:0 1px 3px #4b342b;pointer-events:none}.sealmark path{stroke:#f5d18d;stroke-width:3;fill:none;stroke-linecap:round}.levelpick{display:block;margin-top:8px;padding:7px 10px;border:1px solid #bad1a6;border-radius:9px;background:#eff4de;color:#315c4b;font-weight:700}.subgoal{display:block;margin-top:5px;color:#6c8060;font:13px system-ui,sans-serif}</style></head><body><main class="card"><div class="top"><div><div class="eyebrow">A little puzzle garden</div><h1 id="levelName">Fruit Patch</h1><select class="levelpick" id="level"><option value="meadow">Open Meadow</option><option value="blossom">Blossom Bowl</option><option value="bend">Winding Orchard</option></select></div><div class="stats"><div class="stat"><b id="moves">0</b><small>moves</small></div><div class="stat"><b id="score">0</b><small>score</small></div></div></div><div class="goal">Collect <b style="color:#db584d"><span id="appleTarget">12</span> red apples</b><div class="bar"><i id="progress"></i></div><small class="subgoal" id="blockerGoal">Clear the crate tiles</small></div><div id="board" class="board" aria-label="Fruit board"></div><div id="message" class="msg">Tap a fruit, then an adjacent fruit to swap.</div><div class="actions"><span>Match three or more fruits in a row.</span><div><button class="secondary" id="hint">Show a move</button> <button id="new">New harvest ↻</button></div></div></main>
<script>
let selected=-1,busy=false;
const fruit={
 red:'<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#7b4a29" d="M33 16c-1-7 1-11 7-14 2 6 0 11-7 14"/><path fill="#4e9b52" d="M34 12c6-8 14-7 17-4-4 7-10 8-17 4"/><path fill="#ec5148" d="M32 22c-7-10-23-6-24 8-2 17 12 30 24 26 12 4 26-9 24-26-1-14-17-18-24-8"/><path fill="#ff9981" d="M17 33c1-6 5-9 10-9-3 3-5 7-5 12-2 2-5 1-5-3"/></svg>',
 blue:'<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#426ec7"><circle cx="23" cy="25" r="14"/><circle cx="41" cy="26" r="14"/><circle cx="18" cy="42" r="13"/><circle cx="37" cy="43" r="14"/><circle cx="49" cy="42" r="10"/></g><g fill="#91b8fa"><circle cx="18" cy="20" r="4"/><circle cx="37" cy="21" r="4"/><circle cx="14" cy="38" r="4"/><circle cx="33" cy="38" r="4"/></g><path fill="#69a65c" d="M29 11c4-9 12-9 16-5-4 5-9 7-16 5"/></svg>',
 green:'<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#5eae55" d="M31 17c-5-8-3-13 2-16 5 5 5 10 1 16"/><path fill="#edc95c" d="M31 18C18 8 6 19 10 37c3 15 14 23 22 21 8 2 19-6 22-21 4-18-8-29-21-19l-1 4z"/><path fill="#fff0a0" d="M20 26c-5 6-3 16 1 20 2 2 4 1 3-2-3-6-2-12 0-16 1-3-2-4-4-2"/><path fill="#55944b" d="M32 12c4-8 12-9 16-5-4 6-10 8-16 5"/></svg>',
 gold:'<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#67a75a" d="M30 14c-4-8-2-12 2-14 5 5 4 10 1 15"/><path fill="#f5ad36" d="M15 19c9-8 25-8 34 0 7 7 6 19-2 30-6 8-11 12-15 12s-9-4-15-12c-8-11-9-23-2-30"/><path fill="#ffdf75" d="M20 26c4-7 10-10 17-9-9 4-14 12-14 21 0 5-4 5-5 0-1-4 0-8 2-12"/><path fill="#5f9c50" d="M33 11c4-7 11-8 15-4-4 5-9 7-15 4"/></svg>',
 purple:'<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#64a357" d="M29 14c-2-8 2-12 7-13 3 6 1 10-4 14"/><path fill="#8554bc" d="M26 15c8-5 16 1 13 9 10-5 18 4 11 12 9 1 10 12 1 15 1 9-11 13-17 6-7 7-18 3-17-6-10-3-9-14-1-17-6-8 2-17 11-12-2-3-2-5-1-7"/><g fill="#bd91e5"><circle cx="26" cy="23" r="5"/><circle cx="42" cy="31" r="5"/><circle cx="24" cy="40" r="5"/><circle cx="40" cy="49" r="5"/></g><path fill="#6cad58" d="M33 13c4-8 12-9 16-5-4 6-10 8-16 5"/></svg>'
};
async function refresh(successCells=[]){const s=await (await fetch('/api/state')).json();document.querySelector('#moves').textContent=`${s.moves}/${s.moveLimit}`;document.querySelector('#score').textContent=s.score;document.querySelector('#levelName').textContent=s.levelName;document.querySelector('#level').value=s.level;const n=s.goal?.current??0;document.querySelector('#appleTarget').textContent=s.goal.target;document.querySelector('#progress').style.width=`${Math.min(100,n/s.goal.target*100)}%`;document.querySelector('#blockerGoal').textContent=`Clear crate tiles: ${s.blockerGoal.current}/${s.blockerGoal.target}`;document.querySelector('#message').textContent=s.outcome==='won'?'Garden goal complete! Lovely matching.':s.outcome==='lost'?'Out of moves. Start a fresh garden?':'Tap a fruit, then an adjacent fruit to swap.';const b=document.querySelector('#board');b.innerHTML='';s.board.forEach((c,i)=>{const isVoid=!s.mask[i];const x=document.createElement(isVoid?'div':'button');const sealed=s.seals.find(q=>q.cell===i);x.className=`gem ${isVoid?'void':''} ${sealed?'obstacle':''} ${selected===i?'sel':''} ${successCells.includes(i)?'success':''}`;x.dataset.cell=i;x.setAttribute('aria-label',isVoid?'Outside the level':`${c||'empty'} fruit${sealed?', crate blocker':''}, row ${Math.floor(i/8)+1}, column ${i%8+1}`);x.innerHTML=(fruit[c]||'')+(sealed?'<svg class="sealmark" viewBox="0 0 32 32" aria-label="crate"><path d="M5 6h22v21H5zM5 13h22M5 20h22M12 6v21M20 6v21"/></svg>':'');if(!isVoid)x.onclick=()=>click(i);b.append(x)})}
async function click(i){if(busy)return;if(selected<0){selected=i;await refresh();return}if(i===selected){selected=-1;await refresh();return}if(Math.abs(i-selected)===8||Math.floor(i/8)===Math.floor(selected/8)&&Math.abs(i-selected)===1){busy=true;const from=selected,to=i;const r=await fetch('/api/swap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({from,to})});const result=await r.json();selected=-1;busy=false;await refresh(r.ok?result.matchedCells:[]);if(!r.ok)document.querySelector('#message').textContent='That swap makes no match. Try another pair.'}else{selected=i;await refresh()}}
document.querySelector('#hint').onclick=async()=>{const move=await(await fetch('/api/hint')).json();document.querySelectorAll('.gem.hint').forEach(x=>x.classList.remove('hint'));if(!move){document.querySelector('#message').textContent='No valid swaps left. Start a new harvest.';return}for(const cell of move.matchedCells)document.querySelector(`[data-cell="${cell}"]`).classList.add('hint');document.querySelector('#message').textContent='These fruits will make a match.'};
async function newLevel(level=document.querySelector('#level').value){await fetch('/api/new',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({level})});selected=-1;refresh()}
document.querySelector('#level').onchange=()=>newLevel();document.querySelector('#new').onclick=()=>newLevel();refresh();
</script></body></html>
