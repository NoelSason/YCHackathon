<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101c31"><title>Lot Escape</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="shell"><header><div class="brand"><div class="logo">↗</div><div><p class="eyebrow">A tiny parking puzzle</p><h1>Lot Escape</h1></div></div><button id="reset" class="icon" aria-label="Restart">↻</button></header>
<section class="intro"><div><p id="level-title" class="eyebrow">Morning Rush</p><h2>Make room.<br>Get everyone out.</h2></div><div class="counter"><strong id="moves">0 / 38</strong><span>moves</span></div></section>
<section class="lot-frame"><div class="lot"><div id="board" class="board" aria-label="Parking lot puzzle"></div><div class="gate gate-right">EXIT</div><div class="gate gate-left">EXIT</div><div class="gate gate-top">EXIT</div><div class="gate gate-bottom">EXIT</div></div></section>
<div class="selected-row"><span class="dot"></span><span>SELECTED</span><strong id="selected">Choose a car</strong></div><p id="message" class="message" aria-live="polite">Each car has a marked exit. Clear its lane to let it leave.</p>
<nav class="controls" aria-label="Slide selected vehicle"><button data-dir="up" aria-label="Slide up">↑</button><button data-dir="left" aria-label="Slide left">←</button><button data-dir="down" aria-label="Slide down">↓</button><button data-dir="right" aria-label="Slide right">→</button></nav><footer><span>Vehicles only move along their own lane.</span><button id="next">Next lot ↗</button></footer></main><script>window.STUDIO_API = window.STUDIO_API || __PLATFORM_URL__;</script><script type="module" src="./game.js"></script></body></html>
